[project]
name = "financial-tracker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11",
    "httpx>=0.28",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.3",
    "python-dotenv>=1.2",
    "clerk-backend-api>=6.0",
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "python-multipart>=0.0.32",
    "fastembed>=0.8",
    "pgvector>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=9", "pyyaml>=6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
